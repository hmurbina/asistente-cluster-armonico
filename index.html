<title>HARMONIX · Señales</title>

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=STIX+Two+Text:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#16233A; --muted:#5A6678; --line:#CCD4DE;
  --accent:#3446C4; --fib:#A97A12; --bull:#157455; --bear:#B3303D; --tint-bear:rgba(179,48,61,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F151E; --surface:#161F2B; --ink:#E4EAF2; --muted:#98A5B6; --line:#2D3A4D;
    --accent:#8F9CFF; --fib:#E2B44C; --bull:#4FC79C; --bear:#FF6F7C; --tint-bear:rgba(255,111,124,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151E; --surface:#161F2B; --ink:#E4EAF2; --muted:#98A5B6; --line:#2D3A4D;
  --accent:#8F9CFF; --fib:#E2B44C; --bull:#4FC79C; --bear:#FF6F7C; --tint-bear:rgba(255,111,124,.10);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;padding:24px 18px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gate{width:100%;max-width:520px}
.motif{display:block;width:100%;height:auto;margin:0 0 18px}
.motif polyline{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.motif .prz{fill:var(--fib);opacity:.18}
.motif circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.motif text{font:italic 15px "STIX Two Text",Georgia,serif;fill:var(--muted)}
.kicker{margin:0 0 4px;color:var(--fib);font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-size:1.15rem}
h1{margin:0 0 10px;font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1.02;letter-spacing:-.025em}
.lead{margin:0 0 22px;color:var(--muted);max-width:44ch}
label{display:block;font-weight:700;font-size:.95rem;margin:0 0 6px}
textarea{display:block;width:100%;min-height:96px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font:500 .92rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{font:700 1rem "Schibsted Grotesk",system-ui,sans-serif;padding:11px 22px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.remember{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--muted);margin:0}
.status{min-height:1.5em;margin:16px 0 0;font-size:.95rem}
.status.err{color:var(--bear);background:var(--tint-bear);padding:10px 14px;border-radius:10px}
.status.ok{color:var(--bull)}
.contact{margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
.contact a{color:var(--accent)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) button{color:#0F151E} }
:root[data-theme="dark"] button{color:#0F151E}
@media (prefers-reduced-motion:no-preference){
  .motif polyline{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>
</head>

function b64u(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

  if (!ok) throw new Fail('Este código no es válido. Revisa que lo hayas copiado tal cual lo recibiste.');
  var dv = new DataView(data.buffer);
  var h = new Uint8Array(await crypto.subtle.digest('SHA-256', data.slice(10,14))), key = data.slice(14,30);
  for (var i = 0; i < 16; i++) key[i] ^= h[i];
  return { admin: data[1] === 1, start: dv.getUint32(2), end: dv.getUint32(6), id: hex(data.slice(10,14)), key: key };
}

/* --- 2. Hora de un servicio público (no se usa el reloj del equipo) --- */
function withTimeout(fn){
  var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 6000);
  return fn(ctl.signal).finally(function(){ clearTimeout(t); });
}
var SOURCES = [
  function(sig){ return fetch('https://www.cloudflare.com/cdn-cgi/trace', {cache:'no-store', signal:sig}).then(function(r){ return r.text(); })
    .then(function(t){ var m = t.match(/^ts=(\d+)/m); return m ? +m[1] : NaN; }); },
  function(sig){ return fetch('https://timeapi.io/api/time/current/zone?timeZone=UTC', {cache:'no-store', signal:sig}).then(function(r){ return r.json(); })
    .then(function(j){ return Date.UTC(j.year, j.month-1, j.day, j.hour, j.minute, j.seconds) / 1000; }); },
  function(sig){ return fetch('https://time.now/developer/api/timezone/Etc/UTC', {cache:'no-store', signal:sig}).then(function(r){ return r.json(); })
    .then(function(j){ return +j.unixtime; }); }
];
async function onlineNow(){
  try {
    return await Promise.any(SOURCES.map(function(src){
      return withTimeout(src).then(function(v){ if (!(v > 1.7e9 && v < 4e9)) throw 0; return Math.floor(v); });
    }));
  } catch(e) { throw new Fail('No pude comprobar la fecha en línea. Revisa tu conexión a internet y vuelve a intentarlo.', false); }
}

/* --- 3. Descifrar la herramienta y abrirla --- */
async function openTool(info, now){
  var raw = b64u(CFG.blob), iv = raw.slice(0, 12), ct = raw.slice(12), plain;
  try {
    var k = await crypto.subtle.importKey('raw', info.key, 'AES-GCM', false, ['decrypt']);
    plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k, ct);
  } catch(e) { throw new Fail('Este código es de una versión anterior de la página. Pide uno nuevo.'); }
  var html = new TextDecoder().decode(plain);
  var sess = { admin: info.admin, end: info.end, id: info.id, offset: now - Date.now()/1000, contact: CFG.contact };
  var inject = '<script>(' + SESSION.toString() + ')(' + JSON.stringify(sess).replace(/</g, '\\u003c') + ');<\/script>';
  var i = html.toLowerCase().lastIndexOf('</body>');
  html = i < 0 ? html + inject : html.slice(0, i) + inject + html.slice(i);
  document.open(); document.write(html); document.close();
}

/* Corre dentro de la herramienta: muestra el estado del acceso y vigila el vencimiento. */
function SESSION(s){
  var LS = 'confluencias-armonicas:acceso';
  var now = function(){ return Date.now()/1000 + s.offset; };
  function build(){
    var p = document.createElement('p');
    p.style.cssText = 'margin:.6rem 0 0;font-size:.85rem;color:var(--muted,#5A6678)';
    var txt;
    if (s.admin) txt = 'Acceso de administrador.';
    else {
      var left = Math.ceil((s.end - now()) / 86400);
      txt = 'Tu acceso está activo hasta el ' + new Date(s.end*1000).toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'}) +
        (left <= 3 ? ' (vence en ' + left + (left === 1 ? ' día' : ' días') + ')' : '') + '.';
    }
    p.appendChild(document.createTextNode(txt + ' Código #' + s.id + '. '));
    var out = document.createElement('a'); out.href = '#'; out.textContent = 'Cerrar sesión';
    out.style.color = 'var(--accent,#3446C4)';
    out.addEventListener('click', function(e){ e.preventDefault(); try { localStorage.removeItem(LS); sessionStorage.removeItem(LS); } catch(_) {} location.reload(); });
    p.appendChild(out);
    var f = document.querySelector('footer');
    if (f) f.appendChild(p);
    else { p.style.cssText += ';position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface,#fff);padding:6px 12px;border-radius:999px;border:1px solid var(--line,#ccd4de);z-index:9999'; document.body.appendChild(p); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
  if (!s.admin) setInterval(function(){ if (now() > s.end) location.reload(); }, 60000);
}

/* --- Flujo completo --- */
async function attempt(code, remember){
  var info = await parse(code);
  if (CFG.revoked.indexOf(info.id) >= 0) throw new Fail('Este código fue desactivado. Si crees que es un error, escríbeme.');
  var now;
  if (info.admin) { try { now = await onlineNow(); } catch(e) { now = Math.floor(Date.now()/1000); } }
  else {
    now = await onlineNow();
    if (now < info.start) throw new Fail('Tu acceso empieza el ' + fmt(info.start) + '. Vuelve ese día.', false);
    if (now > info.end) throw new Fail('Tu acceso venció el ' + fmt(info.end) + '. Escríbeme para renovarlo.');
  }
  try {
    if (remember) localStorage.setItem(LS, code); else { localStorage.removeItem(LS); sessionStorage.setItem(LS, code); }
  } catch(e) {}
  await openTool(info, now);
}

function show(msg, cls){ var st = $('st'); st.textContent = msg; st.className = 'status' + (cls ? ' ' + cls : ''); }
async function run(code, remember, auto){
  var btn = $('go'); btn.disabled = true; show(auto ? 'Comprobando tu acceso guardado…' : 'Comprobando el código…');
  try { await attempt(code, remember); }
  catch(e) {
    var f = e instanceof Fail ? e : new Fail('Algo falló al abrir la página. Recarga e inténtalo otra vez.', false);
    if (f.forget) { try { localStorage.removeItem(LS); sessionStorage.removeItem(LS); } catch(_) {} }
    if (auto && f.forget) $('code').value = '';
    show(f.msg, 'err'); btn.disabled = false;
  }
}

if (!window.crypto || !crypto.subtle) { show('Este navegador no puede verificar el código. Ábrelo en Chrome, Edge, Firefox o Safari actualizados, y desde una dirección https.', 'err'); $('go').disabled = true; return; }

$('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = $('code').value.trim();
  if (v) run(v, $('rem').checked, false);
});

var saved = null;
try { saved = localStorage.getItem(LS) || sessionStorage.getItem(LS); } catch(e) {}
if (saved) { $('code').value = saved; run(saved, !!localStorage.getItem(LS), true); }
})();
</script>
