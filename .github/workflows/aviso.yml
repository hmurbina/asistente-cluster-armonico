name: Aviso HARMONIX

on:
  schedule:
    # GitHub usa hora UTC. Nicaragua = UTC-6 todo el año (sin horario de verano).
    # Minutos 7, 22, 37 y 52: GitHub va saturado en los minutos 00/15/30/45 y a veces se salta esas tareas.
    - cron: '7,22,37,52 14-23 * * *'   # 08:07 – 17:52 en Nicaragua
    - cron: '7,22,37,52 0-3 * * *'     # 18:07 – 21:52 en Nicaragua
    - cron: '7 4 * * *'                # 22:07 en Nicaragua (última del día)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Prueba: avisar aunque sea fuera de horario y repetir las zonas ya avisadas'
        type: boolean
        default: true

concurrency:
  group: aviso
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: npm install --no-audit --no-fund
      - run: node aviso.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
