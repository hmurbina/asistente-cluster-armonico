<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HARMONIX · Señales</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%224.5 6.5 23 18%22%3E%3Cpolyline points=%226,22 11,9 15,17 19,12 26,23%22 fill=%22none%22 stroke=%22%234A6CF0%22 stroke-width=%222.6%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=STIX+Two+Text:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#16233A; --muted:#5A6678; --grid:#DDE3EA; --line:#CCD4DE;
  --accent:#3446C4; --tri:rgba(52,70,196,.09); --fib:#A97A12; --prz:rgba(201,148,32,.17);
  --bull:#157455; --bear:#B3303D;
  --tint-bear:rgba(179,48,61,.08); --tint-acc:rgba(52,70,196,.08); --tint-bull:rgba(21,116,85,.09); --tint-fib:rgba(201,148,32,.10);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F151E; --surface:#161F2B; --ink:#E4EAF2; --muted:#98A5B6; --grid:#243042; --line:#2D3A4D;
    --accent:#8F9CFF; --tri:rgba(143,156,255,.13); --fib:#E2B44C; --prz:rgba(226,180,76,.17);
    --bull:#4FC79C; --bear:#FF6F7C;
    --tint-bear:rgba(255,111,124,.10); --tint-acc:rgba(143,156,255,.10); --tint-bull:rgba(79,199,156,.10); --tint-fib:rgba(226,180,76,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151E; --surface:#161F2B; --ink:#E4EAF2; --muted:#98A5B6; --grid:#243042; --line:#2D3A4D;
  --accent:#8F9CFF; --tri:rgba(143,156,255,.13); --fib:#E2B44C; --prz:rgba(226,180,76,.17);
  --bull:#4FC79C; --bear:#FF6F7C;
  --tint-bear:rgba(255,111,124,.10); --tint-acc:rgba(143,156,255,.10); --tint-bull:rgba(79,199,156,.10); --tint-fib:rgba(226,180,76,.10);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1260px;margin:0 auto;padding:0 22px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{max-width:100%}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ic{width:16px;height:16px;vertical-align:-3px;flex:none}

/* cabecera */
.hero{padding-top:40px;padding-bottom:6px}
.herorow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin:0 0 10px}
.hxbrand{display:flex;align-items:center;gap:14px;margin:0;font-weight:800;letter-spacing:.14em;font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1}
.hxbrand .hxlogo{width:auto;height:1.05em;flex:none}
.hxbrand .hxsig{font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0;color:var(--fib);font-size:.8em}
.kicker{color:var(--fib);font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-size:1.15rem;margin:12px 0 4px}
.lead{font-size:1.08rem;max-width:720px;color:var(--muted);margin:0 0 18px}
.prefs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.segbtn{font:inherit;font-size:.9rem;padding:.4rem .8rem;border:0;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.segbtn+.segbtn{border-left:1px solid var(--line)}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
@media (max-width:560px){.segi .segbtn{width:44px;height:42px;justify-content:center}.prefs .seg{height:44px}}

/* grupo de trabajo: sintéticos / mercados */
.bandrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:6px 0 0}
.band{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;gap:4px}
.band button{font:inherit;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;padding:.55rem 1.1rem;text-align:left;line-height:1.25}
.band button b{display:block;font-size:1.02rem;color:var(--ink)}
.band button small{font-size:.8rem}
.band button[aria-pressed="true"]{background:var(--ink)}
.band button[aria-pressed="true"] b,.band button[aria-pressed="true"] small{color:var(--paper)}

.toc{margin:18px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toc ol{margin:0;padding-left:1.3rem;display:flex;flex-wrap:wrap;gap:4px 34px}
.toc li::marker{font-family:"STIX Two Text",Georgia,serif;font-style:italic;color:var(--fib)}

h2{font-size:clamp(1.5rem,3.2vw,2rem);line-height:1.15;letter-spacing:-.01em;margin:3rem 0 .5rem;font-weight:800}
h2 .n{font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-weight:600;color:var(--fib);margin-right:.35em}
h3{font-size:1.1rem;margin:1.6rem 0 .5rem}
.intro{max-width:760px;color:var(--muted);margin:.2rem 0 1rem}

/* botones y controles */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:.22rem .6rem;font-size:.84rem;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:2px 11px;border-radius:999px;border:1px solid var(--line);margin:2px 3px 2px 0;font-size:.86rem;background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.chip.no{color:var(--muted);border-style:dashed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toolbar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600;color:var(--muted)}
.fld select{padding:.45rem .55rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-weight:400;font-size:.95rem}
.inum{width:4.2rem;padding:.2rem .4rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;text-align:right}
.spacer{flex:1}
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:.8rem 0}
details.settings summary{cursor:pointer;font-weight:700}
details.settings label{display:block;margin:.45rem 0;font-size:.93rem}
.instgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin-top:.6rem}
.instgrid fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:.3rem .8rem .5rem}
.instgrid legend{font-weight:700;font-size:.9rem;padding:0 .3rem}
.instgrid legend button{margin-left:.4rem}
.instgrid label{display:flex !important;gap:.4rem;align-items:center;margin:.15rem 0 !important;font-size:.9rem}

.progress{height:6px;border-radius:999px;background:var(--grid);overflow:hidden;margin:.6rem 0 .2rem}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.msg{padding:.55rem .85rem;border-radius:6px;margin:.5rem 0;font-size:.93rem}
.msg.warn{background:var(--tint-bear);border-left:3px solid var(--bear)}
.msg.info{background:var(--tint-acc);border-left:3px solid var(--accent)}
.msg.fib{background:var(--tint-fib);border-left:3px solid var(--fib)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);background:var(--surface)}
.zsub{font-size:.85rem;color:var(--muted)}
.t-bull{color:var(--bull)} .t-bear{color:var(--bear)} .t-fib{color:var(--fib)} .t-mut{color:var(--muted)}
.side{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;white-space:nowrap}

/* tarjetas de señal */
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin:1rem 0}
.sig{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sig.st-wait{--c:var(--fib)} .sig.st-ok{--c:var(--bull)} .sig.st-adv{--c:var(--line)}
.sig.st-adv .chart{opacity:.7}
.sig header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sig h4{margin:0;font-size:1.12rem;line-height:1.25}
.sig h4 .tf{font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-weight:400;color:var(--fib);margin-left:.25em}
.badge{margin-left:auto;font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.st-wait{color:var(--fib)} .badge.st-ok{color:var(--bull)} .badge.st-adv{color:var(--muted)}
.sig .pat{font-size:.9rem;color:var(--muted);margin:0}
.sig .pat b{color:var(--ink)}
.chart{display:block;width:100%;height:auto;border-radius:8px;background:var(--paper)}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;font-size:.92rem;margin:0}
.lv dt{color:var(--muted)}
.lv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.lv .rr{color:var(--muted);font-weight:400;font-size:.84rem;text-align:right}
.lv .hit{color:var(--bull)}
.avbar{position:relative;height:8px;border-radius:999px;background:var(--grid);overflow:hidden}
.avbar i{position:absolute;left:0;top:0;bottom:0;background:var(--bull);border-radius:999px}
.avbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fib)}
.sig.st-adv .avbar i{background:var(--muted)}
.sig .meta{font-size:.84rem;color:var(--muted);margin:0}
.sig footer{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.sig footer label{display:flex;align-items:center;gap:.35rem;font-size:.9rem;font-weight:600;margin-right:auto}
.sig footer .no{font-size:.84rem;color:var(--muted);margin-right:auto}
.snapbar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:1rem 0;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.snapbar .note{flex:1 1 260px;font-size:.88rem;color:var(--muted)}
@media (max-width:640px){
  .snapbar{padding:8px 10px;gap:8px}
  .snapbar:not(.old) .note{display:none}
  .snapbar .btn{flex:1 1 0;justify-content:center;font-size:.86rem;padding:.5rem .6rem}
}

/* tablas */
.tablewrap{overflow-x:auto;margin:.6rem 0 1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:.5rem .75rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-weight:700;color:var(--muted);font-size:.83rem;background:var(--tint-acc);white-space:nowrap}
td.n{white-space:nowrap}
.res{display:inline-block;font-weight:700;font-size:.82rem;padding:0 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.res.win{color:var(--bull)} .res.loss{color:var(--bear)} .res.open{color:var(--muted)}
.tps span{white-space:nowrap;margin-right:.6rem}
.tps .hit{color:var(--bull);font-weight:700}

/* fotos */
.snap{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.7rem 0;padding:0}
.snap>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;list-style:none}
.snap>summary::-webkit-details-marker{display:none}
.snap>summary b{font-size:1.02rem}
.snap>summary .zsub{flex:1}
.snap .tablewrap{margin:0 12px 12px;border-radius:8px}
.snap .sbtns{padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap}
.counts{display:inline-flex;gap:10px;font-size:.88rem}

/* resultados */
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:.4rem 0 .8rem;color:var(--muted);font-size:.93rem}
.stats b{display:block;color:var(--ink);font-family:"STIX Two Text",Georgia,serif;font-style:italic;font-size:1.6rem;font-weight:600;line-height:1.1}
.stats .big b{font-size:2.4rem;color:var(--bull)}
.repwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.repwrap{grid-template-columns:1fr}}
.repimg{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:.6rem 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:8px;font-size:.92rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0 0}
.filetag{display:inline-flex;align-items:center;gap:.4rem;font-size:.86rem;padding:2px 4px 2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.filetag button{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;padding:0 6px}
.drop{display:block;cursor:pointer;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--tint-acc)}
/* cerca de la zona */
.watch{margin:.4rem 0 .8rem}
.zcode{display:inline-block;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:0 7px;margin-right:4px;border-radius:5px;background:var(--tint-acc);color:var(--accent)}
.watchrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.wtoggle{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;flex-wrap:wrap}
.wtoggle input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
.nearbar select{padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
.wtoggle select{padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-weight:400}
.alog{list-style:none;margin:0 0 .5rem;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;font-size:.9rem}
.alog li{padding:3px 0;border-bottom:1px solid var(--grid)}
.alog li:last-child{border-bottom:0}
.alog .num{color:var(--muted);margin-right:.3rem}
.sig.st-near{--c:var(--accent)}
.badge.st-near{color:var(--accent)}
.sig.st-in{--c:var(--ink)} .badge.st-in{color:var(--ink)} .sig.st-in .avbar i{background:var(--ink)}
.sig.st-past{--c:var(--fib)} .badge.st-past{color:var(--fib)} .sig.st-past .avbar i{background:var(--fib)}
.sig.st-in .lv .rr,.sig.st-past .lv .rr{font-variant-numeric:normal}
.lv .hl{background:var(--hlt);color:var(--hlc);font-weight:700;padding-top:3px;padding-bottom:3px}
.lv dt.hl{padding-left:6px;border-radius:6px 0 0 6px;border-left:3px solid var(--hlc)}
.lv dd.hl.rr{color:var(--hlc);border-radius:0 6px 6px 0;padding-right:6px}
.hl-buy{--hlc:var(--bull);--hlt:var(--tint-bull)} .hl-sell{--hlc:var(--bear);--hlt:var(--tint-bear)}
.przbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:.88rem}
.przbox .pzh{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:0 0 4px}
.przbox .pzh b{font-size:.95rem}
.przbox .pzh .num{font-weight:700}
.przbox ul{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:1fr auto;gap:1px 12px}
.przbox li{display:contents}
.przbox li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.przbox li.on span{color:var(--hlc);font-weight:700}
.nearbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:.4rem 0 .6rem;font-size:.93rem}
.nearbar label{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.nearbar .inum{width:5.2rem}
.nearbar .react{flex-basis:100%}
.nearbar>[data-t="ptsA"],.nearbar>[data-t="ptsNote"]{flex-basis:100%}
.nearbar select{padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:.93rem}
.sig.st-near .avbar i{background:var(--accent)}
.sig.st-near .lv .rr{font-variant-numeric:normal}
footer.page{margin:3rem 0 2rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress i{transition:none}}
</style>
</head>
<body>
<header class="wrap hero">
  <div class="herorow">
    <h1 class="hxbrand"><svg class="hxlogo" width="40" height="32" viewBox="4.5 6.5 23 18" aria-hidden="true"><polyline points="6,22 11,9 15,17 19,12 26,23" fill="none" stroke="#4A6CF0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><span>HARMONIX</span><span class="hxsig" data-t="brandSig"></span></h1>
    <div class="prefs">
      <div class="seg" role="group" aria-label="Idioma / Language"><button type="button" class="segbtn" data-lang="es" aria-pressed="true">Español</button><button type="button" class="segbtn" data-lang="en" aria-pressed="false">English</button></div>
      <div class="seg segi" role="group" data-ta="themeGroup"><button type="button" class="segbtn" data-theme-btn="system" data-ta="themeSys"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button><button type="button" class="segbtn" data-theme-btn="light" data-ta="themeLight"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button><button type="button" class="segbtn" data-theme-btn="dark" data-ta="themeDark"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></div>
    </div>
  </div>
  <p class="kicker" data-t="kicker"></p>
  <p class="lead" data-t="lead"></p>
  <nav class="toc" data-ta="navLabel">
    <ol>
      <li><a href="#senales" data-t="nav1"></a></li>
      <li><a href="#cerca" data-t="nav3"></a></li>
      <li><a href="#comparar" data-t="nav2"></a></li>
    </ol>
  </nav>
</header>

<main class="wrap">

<section id="senales">
  <h2><span class="n">1</span><span data-t="nav1"></span></h2>
  <p class="intro" data-t="intro1"></p>
  <div class="panel">
    <div class="bandrow"><div class="band" role="group" id="bandSeg"></div></div>
    <div class="toolbar" style="margin-top:14px">
      <div class="fld"><span data-t="tfs"></span><div id="tfChips"></div></div>
      <label class="fld"><span data-t="hist"></span><select id="histSel"></select></label>
      <div class="spacer"></div>
      <button type="button" class="btn primary" id="scanBtn"></button>

<script>
(function(){
'use strict';
const isF = Number.isFinite;
const num = v => { if(v == null) return NaN; const s = String(v).trim().replace(/\s/g,'').replace(',', '.'); return s === '' ? NaN : Number(s); };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr = r => (+r).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');

/* ============ Motor de HARMONIX v9 (copiado sin cambios) ============ */
/* ============ Teoría ============ */
const FIB_RET = [0.236, 0.382, 0.5, 0.618, 0.707, 0.786, 0.886];
const FIB_EXT = [1.13, 1.272, 1.414, 1.618, 2.0, 2.24, 2.618, 3.14, 3.618];
const ABCD_SET = [0.618, 0.786, 1, 1.272, 1.618, 2.0, 2.618];
const KEY_XA = new Set([0.618, 0.786, 0.886, 1.13, 1.272, 1.618, 2.618]);
const KEY_BC = new Set([1.272, 1.618, 2.0, 2.24, 2.618, 3.618]);
const KEY_AB = new Set([1, 1.272, 1.618]);
const COLORS = ['#3F7FD6','#8E5CCB','#C28A16','#C9507F','#1E9C84','#D8702C','#6E9B2A','#5A66D9','#C94545','#2A9DC0'];

// Patrones clásicos (Carney). b: rango B/XA · d: retroceso/extensión XA (el primero es el principal)
// bc: rango de proyección CD/BC · abcd: variantes AB=CD. C siempre 0.382–0.886 de AB.
const HARM = [
  // Tablas estandarizadas de Carney, Harmonic Trading Vol. 3. tol: tolerancia del punto B (±3% Gartley/Butterfly, ±5% el resto)
  // extra: niveles que Carney incluye en la PRZ (mínimos o capas de tolerancia)
  {key:'gartley',  name:'Gartley',     b:[0.618,0.618], tol:0.03, d:[0.786], bc:[1.13,1.618],  abcd:[1,1.272]},
  {key:'bat',      name:'Bat',         b:[0.382,0.5],   tol:0.05, d:[0.886], bc:[1.618,2.618], abcd:[1,1.272,1.618]},
  {key:'altbat',   name:'Bat alterno', b:[0.236,0.382], tol:0.03, d:[1.13],  bc:[2.0,3.618],   abcd:[1,1.272,1.618], extra:[[0.886,'mínimo 0.886 XA'],[1,'debe incluir 1.0 XA']]},
  {key:'butterfly',name:'Butterfly',   b:[0.786,0.786], tol:0.03, d:[1.272], bc:[1.618,2.24],  abcd:[1,1.272]},
  {key:'crab',     name:'Crab',        b:[0.382,0.618], tol:0.05, d:[1.618], bc:[2.618,3.618], abcd:[1,1.272,1.618], extra:[[1.902,'tolerancia 1.902 XA']]},
  {key:'deepcrab', name:'Deep Crab',   b:[0.886,0.936], tol:0.02, d:[1.618], bc:[2.0,3.618],   abcd:[1,1.272,1.618], extra:[[1.902,'tolerancia 1.902 XA']]}
];
const FAM_RANK = {pat:6, post:5, xa:4, bc:3, abcd:2, st:1};
// Encaje de B con rango preferido (Carney: el Bat admite B < 0.618, pero prefiere 0.382–0.50)
// Encaje con tolerancia (Carney Vol. 3): 1 dentro del ideal; baja hasta 0.7 en el borde de la tolerancia; 0 fuera
function fitTol(v, lo, hi, tol){
  if(!isF(v)) return 0;
  if(v >= lo - 1e-9 && v <= hi + 1e-9) return 1;
  const dev = v < lo ? lo - v : v - hi;
  return dev <= tol + 1e-9 ? 1 - 0.3 * dev / tol : 0;
}
const fitB = (v, h, slack) => fitTol(v, h.b[0], h.b[1], isF(h.tol) ? h.tol : slack);
// Tabla recíproca de Carney: retroceso de C → proyección BC
const RECIP = [[0.382, [2.24, 2.618, 3.14, 3.618]], [0.5, [2.0]], [0.618, [1.618]], [0.707, [1.414]], [0.786, [1.272]], [0.886, [1.13]], [1, [2.0]]];
const recipOf = cab => RECIP.reduce((a, r) => Math.abs(r[0] - cab) < Math.abs(a[0] - cab) ? r : a);

// Encaje de un ratio en un rango: 1 dentro, decae hasta 0.5 en el borde de la tolerancia, 0 fuera
function fitR(v, lo, hi, slack){
  if(!isF(v)) return 0;
  if(v >= lo - 1e-9 && v <= hi + 1e-9) return 1;
  const dev = v < lo ? lo - v : v - hi;
  return dev <= slack ? 1 - 0.5 * dev / slack : 0;
}
const parseExtra = s => String(s || '').split(/[;\s]+|,(?=\s)|,(?=\d+\.)/).map(num).filter(v => isF(v) && v > 0 && v < 10);

/* ============ Estado ============ */
const DEFAULT_SETTINGS = {fav:['crab','deepcrab','butterfly2'], timeTol:0, bandPct:1.5, minPts:0, ratioSlack:0.03, slPct:10, useHistory:true, minLevels:3, minLevelsV:3, minPatterns:1, maxZones:12, sort:'score', extra:'',
  grid:{xa:true, bc:true, abcd:true, struct:true, passed:false}, sum:{hideTaken:true, hidePts:true}, edge:{tol:0.5, fitOnly:false}, trk:{on:true, react:10, bars:2, early:3, tp:'CD'}, cvf:{atrK:3, minBars:3}};
const blankState = () => ({notes:[], asset:{name:'', type:'boom', trend:'auto', decimals:2, price:null, capital:null, riskPct:2, pointValue:1, minLot:0.01}, settings:clone(DEFAULT_SETTINGS), patterns:[], selectedId:null});
let state = blankState();
let dirty = false, editingId = null;
let analyses = [];
let hist = {out:new Map(), byKey:{}, legs:[], bins:[], pref:new Set(), total:0, onFib:0, chance:0};
const PIV = ['E','F','G','H','I','J','K','L'];

const dec = () => state.asset.decimals;
const fmt = n => isF(n) ? n.toFixed(dec()) : '–';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const colorOf = id => { const p = state.patterns.find(q => q.id === id); return p ? p.color : '#888'; };
const labelOf = id => { const p = state.patterns.find(q => q.id === id); return p ? (p.label || 'Sin nombre') : '?'; };

/* ============ Simulador: definiciones ============ */
// sl: [conservador, agresivo] en ratio de la misma base que D. next: a qué migra si el precio atraviesa D.
const SIM = {
  // sl: [SL2 conservador = stop estándar de Carney Vol. 3, SL1 agresivo]. slNote: SL1 que no es un ratio canónico
  gartley:   {name:'Gartley',        fam:'xabcd', b:[.618,.618], tol:.03, d:.786,  base:'XA', bc:[1.13,1.618],  abcd:[1,1.272],       sl:[1,.886],        next:'crab', variant:.886, slAbcd:true},
  bat:       {name:'Bat',            fam:'xabcd', b:[.382,.5],   tol:.05, d:.886,  base:'XA', bc:[1.618,2.618], abcd:[1,1.272,1.618], sl:[1.13,1],        next:'altbat', slAbcd:true},
  altbat:    {name:'Bat alterno',    fam:'xabcd', b:[.236,.382], tol:.03, d:1.13,  base:'XA', bc:[2,3.618],     abcd:[1,1.272,1.618], sl:[1.272,1.2],     next:'crab', extra:[[.886,'mínimo 0.886 XA',true],[1,'1.0 XA',true]], slNote:true},
  butterfly: {name:'Butterfly',      fam:'xabcd', b:[.786,.786], tol:.03, d:1.272, base:'XA', bc:[1.618,2.24],  abcd:[1,1.272],       sl:[1.414,1.343],   next:'butterfly2', slNote:true, slAbcd:true},
  butterfly2:{name:'Extensión 1.618',fam:'xabcd', b:[.786,.786], tol:.03, d:1.618, base:'XA', bc:[2.24,2.618],  abcd:[1.618],         sl:[2,1.902],       next:null, hidden:true, slAbcd:true},
  crab:      {name:'Crab',           fam:'xabcd', b:[.382,.618], tol:.05, d:1.618, base:'XA', bc:[2.618,3.618], abcd:[1,1.272,1.618], sl:[2,1.902],       next:null, extra:[[1.902,'tolerancia 1.902 XA',false]], slAbcd:true},
  deepcrab:  {name:'Deep Crab',      fam:'xabcd', b:[.886,.936], tol:.02, d:1.618, base:'XA', bc:[2,3.618],     abcd:[1,1.272,1.618], sl:[2,1.902],       next:null, extra:[[1.902,'tolerancia 1.902 XA',false]], slAbcd:true},
  shark:     {name:'Shark',          fam:'shark', d:.886,  base:'XA', bc:[1.618,2.24], sl:[1.272,1.2],  next:null, extra:[[1.13,'1.13 XA',true]], slNote:true},
  shark2:    {name:'Shark 1.13',     fam:'shark', d:1.13,  base:'XA', bc:[1.618,2.24], sl:[1.272,1.2],  next:null, hidden:true, slNote:true},
  cypher:    {name:'Cypher',         fam:'cypher',d:.786,  base:'XC', sl:[1,.886],     next:null},
  nenstar:   {name:'Nen Star',       fam:'nenstar', d:1.272, base:'XA', bc:[1.272,2], sl:[1.414,1.343], next:null, slNote:true},
  abcd:      {name:'AB=CD',          fam:'abcd',  d:1,     base:'AB', sl:[1.272,1.13], next:'abcd2'},
  abcd2:     {name:'AB=CD 1.272',    fam:'abcd',  d:1.272, base:'AB', sl:[1.618,1.414],next:'abcd3', hidden:true},
  abcd3:     {name:'AB=CD 1.618',    fam:'abcd',  d:1.618, base:'AB', sl:[2,1.8],      next:null, hidden:true, slNote:true}
};

const rangeTxt = b => b[0] === b[1] ? fr(b[0]) : fr(b[0]) + '–' + fr(b[1]);

function geom(c){
  const {X, A, B, C, D} = c, hasX = isF(X), hasD = isF(D);
  if(![A,B,C].every(isF)) return {ok:false, err:'Faltan A, B o C.'};
  const ab = Math.abs(B - A), bc = Math.abs(C - B);
  if(!ab || !bc) return {ok:false, err:'A, B y C no pueden repetirse.'};
  if(Math.sign(B - A) !== -Math.sign(C - B)) return {ok:false, err:'B y C deben alternar (zigzag).'};
  let dir, xa = NaN;
  if(hasX){ xa = Math.abs(A - X); if(!xa || Math.sign(A - X) !== -Math.sign(B - A)) return {ok:false, err:'X→A debe ir contra A→B.'}; dir = Math.sign(A - X); }
  else dir = Math.sign(C - B);
  if(hasD && Math.sign(D - C) !== -dir) return {ok:false, err:'C→D debe ir contra B→C.'};
  const post = Array.isArray(c.post) ? c.post.filter(isF) : [];
  if(post.length){
    if(!hasD) return {ok:false, err:'Registra D antes de los pivotes posteriores.'};
    let prev = C, cur = D;
    for(const q of post){ if(q === cur || Math.sign(q - cur) !== -Math.sign(cur - prev)) return {ok:false, err:'Los pivotes después de D deben alternar (zigzag).'}; prev = cur; cur = q; }
  }
  const R = {cab: bc / ab};
  if(hasX){ R.bxa = ab / xa; R.cx = Math.abs(C - X) / xa; }
  return {ok:true, hasX, hasD, dir, xa, ab, bc, R, post, cBeyondA:(C - A) * dir > 0, bBeyondX: hasX && (B - X) * dir < 0};
}

function simFit(key, g){
  const P = SIM[key], sl = state.settings.ratioSlack, R = g.R;
  const no = why => ({fit:0, why});
  if(P.fam === 'xabcd'){
    if(!g.hasX) return no('Necesita el punto X.');
    if(g.cBeyondA) return no('C supera a A: mira Cypher o Shark.');
    if(g.bBeyondX) return no('B supera a X: no es un XABCD clásico.');
    const bf = fitB(R.bxa, P, sl), cf = fitR(R.cab, .382, .886, sl);
    if(!bf) return no(`B está en ${fr(R.bxa)} de XA y ${P.name} pide ${rangeTxt(P.b)}.`);
    if(!cf) return no(`C está en ${fr(R.cab)} de AB y el rango válido es 0.382–0.886.`);
    return {fit:Math.min(bf, cf)};
  }
  if(P.fam === 'shark'){
    if(!g.hasX) return no('Necesita el punto X.');
    if(!g.cBeyondA) return no('En un Shark, C debe superar a A (1.13–1.618 de AB).');
    const cf = fitR(R.cab, 1.13, 1.618, sl);
    if(!cf || R.bxa >= 1) return no(`C está en ${fr(R.cab)} de AB y el Shark pide 1.13–1.618.`);
    return {fit:cf};
  }
  if(P.fam === 'cypher'){
    if(!g.hasX) return no('Necesita el punto X.');
    if(!g.cBeyondA) return no('En un Cypher, C debe superar a A (1.13–1.414 de XA).');
    const bf = fitR(R.bxa, .382, .618, sl), xf = fitR(R.cx, 1.13, 1.414, sl);
    if(!bf) return no(`B está en ${fr(R.bxa)} de XA y el Cypher pide 0.382–0.618.`);
    if(!xf) return no(`C extiende ${fr(R.cx)} de XA y el Cypher pide 1.13–1.414.`);
    return {fit:Math.min(bf, xf)};
  }
  if(P.fam === 'nenstar'){
    if(!g.hasX) return no('Necesita el punto X.');
    if(!g.cBeyondA) return no('En un Nen Star, C debe superar a A (1.13–2.14 de AB).');
    if(g.bBeyondX) return no('En un Nen Star, B no debe superar a X.');
    const bf = fitR(R.bxa, .382, .618, sl), cf = fitR(R.cab, 1.13, 2.14, sl);
    if(!bf) return no(`B está en ${fr(R.bxa)} de XA y el Nen Star pide 0.382–0.618.`);
    if(!cf) return no(`C está en ${fr(R.cab)} de AB y el Nen Star pide 1.13–2.14.`);
    return {fit:Math.min(bf, cf)};
  }
  if(g.cBeyondA) return no('C supera a A: no es un AB=CD.');
  const cf = fitR(R.cab, .382, .886, sl);
  return cf ? {fit:cf} : no(`C está en ${fr(R.cab)} de AB y el rango válido es 0.382–0.886.`);
}

function simCompute(c, key, slMode, tpMode, entryMode){
  const g = geom(c); if(!g.ok) return {ok:false, err:g.err};
  const P = SIM[key], {X, A, B, C} = c, dir = g.dir;
  if((P.base === 'XA' || P.base === 'XC') && !g.hasX) return {ok:false, err:P.name + ' necesita el punto X.'};
  const XC = g.hasX ? Math.abs(C - X) : NaN;
  const at = {XA:k => A - dir * k * g.xa, XC:k => C - dir * k * XC, BC:k => C - dir * k * g.bc, AB:k => C - dir * k * g.ab}[P.base];
  const bcP = k => C - dir * k * g.bc, abP = k => C - dir * k * g.ab;
  const leg = g.hasX ? g.xa : g.ab;
  // identidad de la medida: ratio + tramo + punto desde donde se proyecta. Así el XA de una estructura y el BC de otra con los mismos precios cuentan como una sola medida
  const legKey = {XA:X + '>' + A + '@' + A, XC:X + '>' + C + '@' + C, BC:B + '>' + C + '@' + C, AB:A + '>' + B + '@' + C}, sk = (b, k) => legKey[b] ? '#' + fr(k) + '|' + legKey[b] : '';
  const Dp = at(P.d);
  const proj = [{label:fr(P.d) + ' ' + P.base, v:Dp, main:true, inPrz:true, src:P.base + ' ' + fr(P.d) + sk(P.base, P.d)}];
  let bcBest = null;
  if(P.bc){
    FIB_EXT.forEach(f => { if(f < P.bc[0] - 1e-9 || f > P.bc[1] + 1e-9) return; const v = bcP(f); if(!bcBest || Math.abs(v - Dp) < Math.abs(bcBest.v - Dp)) bcBest = {f, v}; });
    if(bcBest){
      proj.push({label:fr(bcBest.f) + ' BC', v:bcBest.v, inPrz:true, bc:true, src:'BC ' + fr(bcBest.f) + sk('BC', bcBest.f)});
      const f2 = FIB_EXT.find(q => q > bcBest.f + 1e-9);   // capa BC (Carney Vol. 3): tolerancia más allá del ideal
      if(f2) proj.push({label:fr(f2) + ' BC (capa de tolerancia)', v:bcP(f2), inPrz:false, bc:true, layer:true});
    }
  }
  let abcdPt = null;
  if(P.abcd){
    let best = null; P.abcd.forEach(f => { const v = abP(f); if(!best || Math.abs(v - Dp) < Math.abs(best.v - Dp)) best = {f, v}; });
    const near = Math.abs(best.v - Dp) <= 0.10 * leg;
    proj.push({label:(best.f === 1 ? 'AB=CD' : 'AB=CD ' + fr(best.f)) + (near ? '' : ' (lejos)'), v:best.v, inPrz:near, src:'AB ' + fr(best.f) + sk('AB', best.f)});
    abcdPt = {v:best.v, f:best.f};
  }
  if(P.base === 'AB' && fitR(g.R.cab, .382, .886, .03) > 0){
    const rc = recipOf(g.R.cab), k = rc[1].reduce((a, q) => Math.abs(bcP(q) - Dp) < Math.abs(bcP(a) - Dp) ? q : a), v = bcP(k), near = Math.abs(v - Dp) <= 0.10 * leg;
    proj.push({label:'BC recíproco ' + fr(k) + (near ? '' : ' (lejos)'), v, inPrz:near, bc:true, src:'BC ' + fr(k) + sk('BC', k)});
  }
  (P.extra || []).forEach(([k, t, inP]) => proj.push({label:t, v:at(k), inPrz:inP, layer:!inP, src:P.base + ' ' + fr(k) + sk(P.base, k)}));
  if(P.variant && g.R.cab <= 0.64) proj.push({label:'variante ' + fr(P.variant) + ' XA (BC ≥ 1.618)', v:at(P.variant), inPrz:true, src:P.base + ' ' + fr(P.variant) + sk(P.base, P.variant)});
  const hs = state.settings.useHistory && hist.byKey[key];
  if(hs && hs.devN >= 2){
    const v = Dp - dir * hs.devMean * leg, near = Math.abs(v - Dp) <= 0.10 * leg;
    proj.push({label:'D según historial (' + hs.devN + ')', v, inPrz:near, hist:true, src:'historial'});
  }
  const pz = proj.filter(p => p.inPrz).map(p => p.v);
  const prz = [Math.min(...pz), Math.max(...pz)];
  const E = g.hasD ? c.D : Dp;
  let slR = slMode === 'agr' ? P.sl[1] : P.sl[0];
  if(slR <= P.d + 1e-9) slR = P.d * 1.15;
  const baseLeg = {XA:g.xa, XC:XC, BC:g.bc, AB:g.ab}[P.base];
  // Carney: el stop "depende del AB=CD". Si el AB=CD de la PRZ completa más allá del stop estándar, el stop va detrás del AB=CD
  let SL = at(slR) - dir * 0.02 * baseLeg, slByAbcd = null, abcdFar = null;
  if(P.slAbcd && abcdPt && (abcdPt.v - at(slR)) * dir < 0){
    const past = Math.abs(abcdPt.v - at(slR));
    if(past <= 0.25 * baseLeg){ SL = abcdPt.v - dir * 0.02 * baseLeg; slByAbcd = abcdPt; }   // hasta 0.25 del tramo: el stop va detrás del AB=CD
    else abcdFar = abcdPt;                                                                   // más lejos: PRZ incoherente
  }

  const ref = tpMode === 'CD' ? C : refAD;

  const TP1 = E + tpR[0] * (ref - E), TP2 = E + tpR[1] * (ref - E);

  const nearEdge = dir > 0 ? prz[1] : prz[0];
  const plan = !g.hasD && entryMode === 'prz' ? przPlanOf(prz, dir, baseLeg) : null;
  const entry = g.hasD ? c.D : entryMode === 'conf' ? nearEdge : plan ? plan.orders[0].v : Dp;
  const risk = plan ? plan.orders[0].risk : Math.abs(entry - SL);
  const pts = [];
  if(g.hasX) pts.push({n:'X', v:X});
  pts.push({n:'A', v:A}, {n:'B', v:B}, {n:'C', v:C}, {n:'D', v:g.hasD ? c.D : Dp, fut:!g.hasD});
  const iD = pts.length - 1;
  if(g.hasD) g.post.forEach((v,i) => pts.push({n:PIV[i], v}));

  const conns = [];
  if(g.hasX){
    conns.push([iOf('X'), iOf('B'), 'B ' + fr(g.R.bxa)]);
    if(P.fam === 'cypher') conns.push([iOf('X'), iOf('C'), 'C ' + fr(g.R.cx) + ' XA']);
    else conns.push([iOf('A'), iOf('C'), 'C ' + fr(g.R.cab)]);
    if(bcBest) conns.push([iOf('B'), iOf('D'), fr(bcBest.f) + ' BC']);
    conns.push([iOf('X'), iOf('D'), fr(P.d) + ' ' + P.base]);
  } else {
    conns.push([iOf('A'), iOf('C'), 'C ' + fr(g.R.cab)]);

}

// Operar la PRZ: una sola orden límite según el ancho de la PRZ (en % del tramo base)
//  < 3%: en la mitad · 3% o más: al 90% de la PRZ (cerca del borde lejano)
//  stop: más allá del borde lejano (+2% del tramo)
//  objetivo: el borde cercano de la PRZ (el precio sale de la zona) o 1R, el que quede más lejos
const PRZ_NARROW = 0.03, PRZ_WIDE = 0.05, PRZ_DEEP = 0.9;
function przPlanOf(prz, dir, legBase){
  const w = prz[1] - prz[0], pct = legBase ? w / legBase : NaN;
  const near = dir > 0 ? prz[1] : prz[0], far = dir > 0 ? prz[0] : prz[1], mid = (prz[0] + prz[1]) / 2;
  const SL = far - dir * 0.02 * legBase;
  const type = pct < PRZ_NARROW ? 'una' : pct <= PRZ_WIDE ? 'bordes' : 'ancha';
  const v = type === 'una' ? mid : near + PRZ_DEEP * (far - near);
  const n = type === 'una' ? 'Orden (mitad de la PRZ)' : 'Orden al 90% de la PRZ';
  const t1R = v + (v - SL), useEdge = Math.abs(near - v) >= Math.abs(t1R - v);
  const T = useEdge ? near : t1R, tKind = useEdge ? 'edge' : '1R';
  const o = {n, v, risk:Math.abs(v - SL), gain:Math.abs(T - v)}; o.rr = o.gain / o.risk;
  const orders = [o], sumRisk = o.risk;
  const a = state.asset, step = a.minLot > 0 ? a.minLot : 0.01, dp = Math.max(0, (String(step).split('.')[1] || '').length);
  let lots = null;
  if(isF(a.capital) && a.capital && a.pointValue && sumRisk){
    const money = a.capital * (a.riskPct || 0) / 100, raw = money / (sumRisk * a.pointValue), l = Math.floor(raw / step + 1e-9) * step;
    lots = {each:+l.toFixed(dp), money, real:l * sumRisk * a.pointValue, below:l < step - 1e-12, dp};

  return {w, pct, type, near, far, mid, SL, T, tKind, orders, sumRisk, lots, avg:v};
}
const PRZ_TYPE_TXT = {una:'estrecha (< 3%): orden en la mitad', bordes:'normal (3–5%): orden al 90%', ancha:'ancha (> 5%): orden al 90%'};

// Encajes buenos (≥65%) cuentan igual: entre ellos gana la PRZ que el precio tocaría primero, como en la escalera
const tier = f => f >= 0.65 ? 2 : f > 0 ? 1 : 0;
// Ranking: compatibles primero, luego mejor encaje, luego el que el precio tocaría primero (o el más cercano a D real)
function rankCands(c){
  const g = geom(c); if(!g.ok) return [];
  return Object.keys(SIM).filter(k => !SIM[k].hidden).map(k => {
    const f = simFit(k, g);
    const r = simCompute(c, k, 'cons', 'AD');
    const dist = r.ok ? Math.abs(r.Dp - (g.hasD ? c.D : c.C)) : Infinity;
    // con X, un patrón XABCD es más específico que un AB=CD suelto
    const spec = g.hasX && SIM[k].fam !== 'abcd' ? 1 : 0;
    return {key:k, fit:f.fit, why:f.why || '', dist, spec};
  }).sort((a,b) => ((b.fit > 0) - (a.fit > 0)) || (b.spec - a.spec) || (g.hasD ? a.dist - b.dist : (tier(b.fit) - tier(a.fit)) || (a.dist - b.dist)));
}

const z2 = n => String(n).padStart(2, '0');
const PARENT = {butterfly2:'butterfly', shark2:'shark', abcd2:'abcd', abcd3:'abcd'};
const FIB_ALL = [0.236, 0.382, 0.5, 0.618, 0.707, 0.786, 0.886, 1, 1.13, 1.272, 1.414, 1.618, 2, 2.24, 2.618, 3.14, 3.618];
const noD = c => ({X:c.X, A:c.A, B:c.B, C:c.C, D:NaN, post:[]});
// Todas las PRZ: la de cada patrón posible con estas X, A, B y C, ordenadas por cercanía a C
const XA_EXTREMES = [[2, '2.0 XA'], [2.24, '2.24 XA']];
function allPrzData(c, taken){
  const tk = new Set(taken || []);
  const c0 = noD(c), g = geom(c0); if(!g.ok) return null;
  const rows = Object.keys(SIM).filter(k => k !== 'shark2').map(k => {
    const r = simCompute(c0, k, 'cons', 'AD'); if(!r.ok) return null;
    const f = simFit(PARENT[k] && k !== 'butterfly2' ? PARENT[k] : k, g);
    const dep = v => g.dir * (c.C - v);
    const near = g.dir > 0 ? r.prz[1] : r.prz[0], far = g.dir > 0 ? r.prz[0] : r.prz[1];
    const eps = 1e-9 * Math.max(1, Math.abs(far)), farSrc = [...new Set(r.proj.filter(q => q.inPrz && Math.abs(q.v - far) <= eps).map(q => q.src).filter(Boolean))];
    return {k, r, fit:f.fit, why:f.why || '', near, far, farSrc, dNear:dep(near), dFar:dep(far), dD:dep(r.Dp), dSL:dep(r.SL)};
  }).filter(Boolean).sort((a, b) => a.dNear - b.dNear || a.dFar - b.dFar);

  // con X, el AB=CD ya forma parte de la PRZ de cada XABCD: no cuenta como patrón aparte en las confluencias
  rows.forEach(x => { x.taken = tk.has(x.k); });

}

/* ============ Detector: velas → pivotes → formaciones ============ */
const CV_MAX_FORMS = 12;
var cv = {candles:null, showAll:false, showAllE:false, side:'all', sort:'prob', bt:null, sym:'', tf:'', file:'', thr:{}, scale:'all', prov:true, alt:true, usePrice:true, sel:null, forms:[]};
const CV_SCALES = [{id:'mayor', name:'Mayor', target:7}, {id:'media', name:'Media', target:18}, {id:'interna', name:'Interna', target:45}];
const TF_SEC = [[60,'M1'],[120,'M2'],[180,'M3'],[300,'M5'],[600,'M10'],[900,'M15'],[1800,'M30'],[3600,'H1'],[7200,'H2'],[14400,'H4'],[28800,'H8'],[86400,'D1'],[604800,'W1']];

// Lee CSV de «Descargar velas de Deriv», TradingView (time en unix o ISO) o MT5 (<DATE> <TIME> separados por tabulador)
function parseCandles(text){
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 10) throw new Error('El archivo tiene menos de 10 filas.');
  const sep = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  const head = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, '').replace(/[<>]/g, '').toLowerCase());
  const col = names => head.findIndex(h => names.includes(h));
  const iE = col(['epoch','timestamp','unix']), iT = col(['time','datetime','date time','fecha']), iD = col(['date']), iH = col(['time']);
  const iO = col(['open','apertura']), iHi = col(['high','máximo','maximo']), iL = col(['low','mínimo','minimo']), iC = col(['close','cierre']);
  if([iO, iHi, iL, iC].some(i => i < 0)) throw new Error('No encuentro las columnas open, high, low y close en la primera fila.');
  const toSec = v => {
    v = String(v).trim().replace(/^"|"$/g, '');
    if(/^\d{9,13}$/.test(v)){ const n = +v; return n > 1e12 ? Math.round(n / 1000) : n; }
    let t = v.replace(/^(\d{4})\.(\d{2})\.(\d{2})/, '$1-$2-$3').replace(' ', 'T');
    if(!/[zZ]|[+-]\d{2}:?\d{2}$/.test(t)) t += 'Z';              // sin zona: se toma como UTC (así lo escribe el descargador)
    const ms = Date.parse(t); return isF(ms) ? Math.round(ms / 1000) : NaN;
  };
  let maxDec = 0;
  const rows = lines.slice(1).map(l => {
    const c = l.split(sep);
    const tRaw = iE >= 0 ? c[iE] : (iD >= 0 && iH >= 0 && iD !== iH) ? c[iD] + ' ' + c[iH] : c[iT >= 0 ? iT : 0];
    const q = [iO, iHi, iL, iC].map(i => String(c[i] || '').trim().replace(/^"|"$/g, ''));
    q.forEach(x => { const d = (x.split('.')[1] || '').length; if(d > maxDec) maxDec = d; });
    const [o, h, lo, cl] = q.map(Number);
    return {t:toSec(tRaw), o, h, l:lo, c:cl};
  }).filter(k => isF(k.t) && [k.o, k.h, k.l, k.c].every(isF) && k.h >= k.l).sort((a, b) => a.t - b.t);
  if(rows.length < 10) throw new Error('No pude leer las fechas o los precios de las filas.');
  const gaps = rows.slice(1).map((k, i) => k.t - rows[i].t).filter(d => d > 0).sort((a, b) => a - b), step = gaps[Math.floor(gaps.length / 2)] || 0;
  const tf = (TF_SEC.find(([s]) => s === step) || [0, step ? Math.round(step / 60) + 'min' : ''])[1];
  return {rows, tf, dec:Math.min(5, maxDec)};
}

function zigzag(r, thr){
  const piv = []; let dir = 0, hi = {i:0, v:r[0].h}, lo = {i:0, v:r[0].l}, cand = null;
  for(let i = 1; i < r.length; i++){
    const k = r[i];
    if(dir === 0){
      if(k.h > hi.v) hi = {i, v:k.h}; if(k.l < lo.v) lo = {i, v:k.l};
      if(hi.v - lo.v >= thr){ if(hi.i > lo.i){ piv.push({...lo, hl:'L'}); dir = 1; cand = {...hi}; } else { piv.push({...hi, hl:'H'}); dir = -1; cand = {...lo}; } }
      continue;
    }
    if(dir === 1){ if(k.h >= cand.v) cand = {i, v:k.h}; else if(cand.v - k.l >= thr){ piv.push({...cand, hl:'H'}); dir = -1; cand = {i, v:k.l}; } }
    else { if(k.l <= cand.v) cand = {i, v:k.l}; else if(k.h - cand.v >= thr){ piv.push({...cand, hl:'L'}); dir = 1; cand = {i, v:k.h}; } }
  }
  return {piv, cand:cand ? {...cand, hl:dir === 1 ? 'H' : 'L', prov:true} : null};
}
// umbral que deja ~target pivotes (búsqueda binaria; el número de pivotes baja al subir el umbral)
function thrFor(r, target){
  let lo = 0, hi = Math.max(...r.map(k => k.h)) - Math.min(...r.map(k => k.l));
  for(let n = 0; n < 40; n++){ const m = (lo + hi) / 2; if(zigzag(r, m).piv.length > target) lo = m; else hi = m; }
  return hi;
}
// Umbrales automáticos: se calculan con las últimas 1000 velas (los giros objetivo de cada escala son por cada 1000 velas), así 1000, 3000
// o 5000 velas dan las mismas escalas y la historia extra solo suma casos a la estadística. Nunca bajan del suelo:
// «suelo» veces la vela típica (mediana del rango máximo-mínimo de esas velas). El suelo solo quita ruido.
const cvfOpt = () => state.settings.cvf || (state.settings.cvf = clone(DEFAULT_SETTINGS.cvf));
function typicalRange(r){ const a = r.map(k => k.h - k.l).filter(v => isF(v) && v >= 0).sort((p, q) => p - q); return a.length ? a[Math.floor(a.length / 2)] : 0; }
function autoThr(r, round){
  const O = cvfOpt(), w = r.slice(-1000), floor = Math.max(0, +O.atrK || 0) * typicalRange(w), out = {};
  CV_SCALES.forEach(sc => { const v = Math.max(thrFor(w, sc.target), floor); out[sc.id] = round ? Math.max(roundThr(v), round === 'up' ? v : 0) : v; });
  return out;
}
const minBarsOf = () => Math.max(0, Math.round(+cvfOpt().minBars || 0));
const roundThr = v => { const e = Math.pow(10, Math.max(0, dec() - 1)); return Math.round(v * e) / e; };
const tLocal = sec => { const d = new Date(sec * 1000); return `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}T${z2(d.getHours())}:${z2(d.getMinutes())}`; };
const tShort = sec => { const d = new Date(sec * 1000); return `${z2(d.getDate())}/${z2(d.getMonth() + 1)} ${z2(d.getHours())}:${z2(d.getMinutes())}`; };

// ¿es X el extremo del tramo X→A y A el extremo opuesto? (para probar X anteriores)
function cleanLeg(r, iX, iA, xIsHigh){
  let mx = -Infinity, mn = Infinity;
  for(let i = iX; i <= iA; i++){ mx = Math.max(mx, r[i].h); mn = Math.min(mn, r[i].l); }
  return xIsHigh ? (r[iX].h >= mx && r[iA].l <= mn) : (r[iX].l <= mn && r[iA].h >= mx);
}


/* ============ Seguimiento de D: la zona se respetó, se esperan TP1, TP2 y TP3 ============ */
// El D real es el extremo que marcó el precio después de C (antes de volver a superar C). Con él se decide qué patrón completó:
//   dentro de su PRZ · un poco antes del borde cercano (hasta «giro anticipado» % del tramo base) · más allá del borde lejano sin tocar su SL.
// Si coincide con varios, gana el que menos se desvía de su PRZ (así un Bat que se pasa hasta el 1.13 pasa a ser Bat alterno).
// Los objetivos se miden desde ese D real, sobre CD (por defecto), AD (Carney) o mixto; Shark: 0.5 y 0.618 de CD. TP3 en 1.0 del tramo.
// Se da por respetada solo con velas cerradas sin nuevo extremo y una reacción mínima del tramo AD; antes de eso no se dibuja nada.
const trkOpt = () => DEFAULT_SETTINGS.trk;   // seguimiento de D con sus opciones por defecto (controles ocultos)
const TRK_MAX_AGE = 300;   // velas: un D más antiguo deja de seguirse
function trkExtreme(r, iC, C, dir, liveLast, cache){
  const ck = iC + ':' + dir; if(cache && cache.has(ck)) return cache.get(ck);
  const n = r.length, adv = v => dir * (C - v);
  let iD = -1, best = 0;
  for(let i = iC + 1; i < n; i++){
    const k = r[i];
    if(adv(dir > 0 ? k.h : k.l) < 0) break;              // volvió a superar C: el tramo CD terminó
    const tw = adv(dir > 0 ? k.l : k.h); if(tw > best){ best = tw; iD = i; }
  }

    const Dv = dir > 0 ? r[iD].l : r[iD].h, lastClosed = liveLast ? n - 2 : n - 1;
    let awAll = Dv, awClosed = Dv;                           // mejor precio a favor después de D (la vela de D no cuenta)
    for(let i = iD + 1; i < n; i++){ const a = dir > 0 ? r[i].h : r[i].l; if(dir * (a - awAll) > 0) awAll = a; if(i <= lastClosed && dir * (a - awClosed) > 0) awClosed = a; }
    res = {iD, Dv, dE:best, awAll, awClosed, closedAfter:Math.max(0, lastClosed - iD)};
  }

}
function trkMatch(ex, c, g, rows){
  const O = trkOpt(), dir = g.dir, d = ex.dE;

  rows.forEach(q => {
    if(!(q.fit > 0) || q.taken || (g.hasX && SIM[q.k].fam === 'abcd') || !q.r || !q.r.ok) return;
    if(d >= q.dSL) return;                                   // tocó el SL de este patrón
    const leg = q.r.baseLeg || (g.hasX ? g.xa : g.ab), tol = Math.max(0, +O.early || 0) / 100 * leg;
    let where, off;
    if(d >= q.dNear - 1e-12 && d <= q.dFar + 1e-12){ where = 'dentro'; off = 0; }
    else if(d < q.dNear){ if(d < q.dNear - tol) return; where = 'antes'; off = (q.dNear - d) / leg; }
    else { where = 'pasado'; off = (d - q.dFar) / leg; }
    if(!best || off < best.off - 1e-9 || (Math.abs(off - best.off) <= 1e-9 && q.fit > best.q.fit)) best = {q, where, off};
  });

  // Shark, Cypher y Nen Star miden siempre sobre el último tramo (CD), como en el simulador.
  const mode = ['CD', 'AD', 'mix'].includes(O.tp) ? O.tp : 'CD', cdOnly = P.fam === 'cypher' || P.fam === 'shark' || P.fam === 'nenstar';
  const refOf = i => cdOnly || mode === 'CD' || (mode === 'mix' && i === 0) ? 'CD' : 'AD';
  const tps = [q.r.tpR[0], q.r.tpR[1], 1].map((k, i) => {

  const span1 = (tps[0].ref === 'CD' ? c.C : c.A) - Dv;
  const react = Math.abs(span1) ? dir * (ex.awClosed - Dv) / Math.abs(span1) : 0;
  const base = P.base, anchor = base === 'XA' ? c.A : c.C;
  const ratio = q.r.baseLeg ? Math.abs(Dv - anchor) / q.r.baseLeg : NaN;
  const confirmed = ex.closedAfter >= Math.max(0, Math.round(+O.bars || 0)) && react >= Math.max(0, +O.react || 0) / 100;
  return {k:q.k, fit:q.fit, where:best.where, off:best.off, Dv, SL:q.r.SL, tps, refN:tps[0].ref, react, ratio, base, confirmed};
}
const trkWhere = t => t.where === 'dentro' ? 'dentro de la PRZ' : t.where === 'antes' ? `giró ${fr(t.off)} ${t.base} antes de la PRZ` : `pasó ${fr(t.off)} ${t.base} el borde, sin tocar el SL`;

// formaciones X-A-B-C. Con «unir tramos», cada pierna puede abarcar varios zigzags: basta con que sea un tramo limpio
// (sus extremos son el máximo y el mínimo de todo lo que hay entre ellos). C no debe haber sido superado después.
function buildForms(){
  const r = cv.candles; cv.formsAux = []; if(!r) return [];
  const last = r[r.length - 1], P0 = isF(state.asset.price) ? state.asset.price : last.c;
  const thrs = CV_SCALES.map(sc => cv.thr[sc.id]).filter(v => v > 0);
  if(!thrs.length) return [];
  // máximos y mínimos de rango con tabla dispersa: cada consulta en O(1)

const WS_URL = 'wss://api.derivws.com/trading/v1/options/ws/public';
const API = {ws:null, rid:0, pend:new Map(), opening:null};
function apiOpen(){
  if(API.ws && API.ws.readyState === 1) return Promise.resolve();
  if(API.opening) return API.opening;
  API.opening = new Promise((res, rej) => {
    let w; try { w = new WebSocket(WS_URL); } catch(e){ API.opening = null; rej(new Error('net')); return; }
    const to = setTimeout(() => { try { w.close(); } catch(e){} }, 15000);
    w.onopen = () => { clearTimeout(to); API.ws = w; API.opening = null; res(); };
    w.onerror = () => {};
    w.onclose = () => {
      clearTimeout(to); if(API.opening){ API.opening = null; rej(new Error('net')); }
      API.ws = null; API.pend.forEach(p => p.rej(Object.assign(new Error('closed'), {code:'closed'}))); API.pend.clear();
    };
    w.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch(x){ return; }
      const p = API.pend.get(d.req_id); if(!p) return;
      API.pend.delete(d.req_id); clearTimeout(p.to);
      if(d.error) p.rej(Object.assign(new Error(d.error.message || 'API'), {code:d.error.code})); else p.res(d);
    };
  });
  return API.opening;
}
async function api(req){
  await apiOpen();
  const id = ++API.rid;
  return new Promise((res, rej) => {
    const to = setTimeout(() => { if(API.pend.has(id)){ API.pend.delete(id); rej(Object.assign(new Error('timeout'), {code:'timeout'})); } }, 30000);
    API.pend.set(id, {res, rej, to});
    API.ws.send(JSON.stringify({...req, req_id:id}));
  });
}
// petición con reintentos (límite de Deriv, conexión caída)
async function apiRetry(req, onWait){
  for(let a = 0; ; a++){
    try { return await api(req); }
    catch(e){
      if(a >= 3) throw e;
      if(e.code === 'RateLimit'){ if(onWait) onWait(true); await sleep(20000); if(onWait) onWait(false); continue; }
      if(e.code === 'closed' || e.code === 'timeout' || e.message === 'net'){ await sleep(1500 * (a + 1)); continue; }
      throw e;
    }
  }
}

async function getCandles(sym, gran, want, onWait){

  for(let p = 0; p < 4 && all.size < want; p++){
    const d = await apiRetry({ticks_history:sym, end:String(end), count:Math.min(1000, want - all.size), style:'candles', granularity:gran, adjust_start_time:1}, onWait);
    if(d.pip_size != null) pip = d.pip_size;
    const rows = toRows(d.candles); if(!rows.length) break;
    const oldest = rows[0].t; if(oldest >= prevOldest) break;
    rows.forEach(k => all.set(k.t, k)); prevOldest = oldest; end = oldest - 1;
    if(rows.length < 50) break;
  }
  return {rows:[...all.values()].sort((a, b) => a.t - b.t), pip};
}

function nearItems(){
  const rMax = (+S.nearReact || 15) / 100, items = [];

let SCAN = {band:null, running:false, items:[], near:[], errors:[], total:0, done:0, cur:'', t:0, wait:false, charts:0};

  if(SCAN.running) return;
  const syms = bandSyms(S.band).filter(s => !S.off.includes(s)), tfs = S.tfs.slice().sort((a, b) => a - b), want = +S.hist || 1000;
  if(!syms.length || !tfs.length){ $('scanStatus').textContent = t('emptyScan'); return; }
  const jobs = []; tfs.forEach(g => syms.forEach(sym => jobs.push({sym, g})));
  SCAN = {band:S.band, running:true, items:[], near:[], errors:[], total:jobs.length, done:0, cur:'', t:nowS(), wait:false, charts:0};
  ROWS.clear(); renderScanAll();
  let i = 0, netFail = 0;
  const worker = async () => {
    while(i < jobs.length){
      const j = jobs[i++]; SCAN.cur = symName(j.sym) + ' ' + tfName(j.g); renderProgress();
      try {
        const d = await getCandles(j.sym, j.g, want, w => { SCAN.wait = w; renderProgress(); });
        const rows = d.rows;
        if(rows.length >= 120){
          SCAN.charts++;
          const sigs = detectSignals(j.sym, j.g, rows, d.pip, SCAN.band);
          if(sigs.length){ ROWS.set(j.sym + '|' + j.g, rows); sigs.forEach(s => { s.pick = sigStatus(s) !== 'adv' && canSend(s); mergeSig(s); }); }
          const nz = detectNear(j.sym, j.g, rows, d.pip, SCAN.band);
          if(nz.length){ ROWS.set(j.sym + '|' + j.g, rows); SCAN.near.push(...nz); }
        }
      } catch(e){ if(e.message === 'net') netFail++; SCAN.errors.push({sym:j.sym, g:j.g, msg:e.message || String(e)}); }
      SCAN.done++; renderProgress(); scheduleCards();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  SCAN.running = false; SCAN.t = nowS();
  if(netFail && netFail === SCAN.done) SCAN.netFail = true;
  renderScanAll();

}

function nearChartEls(z, rows, w, h, P, fs){
  const idx = new Map(rows.map((r, i) => [r.t, i]));
  const iX = idx.has(z.tm.X) ? idx.get(z.tm.X) : Math.max(0, rows.length - 120);
  const i0 = Math.max(0, iX - 6), data = rows.slice(i0);
  const eC = z.dir > 0 ? P.bull : P.bear;
  const lines = [{v:z.near, c:z.edge === 'near' ? eC : P.fib, lab:z.edge === 'near' ? '◀' : '', dash:z.edge === 'near' ? '' : '3 3'}, {v:z.far, c:z.edge === 'far' ? eC : P.fib, lab:z.edge === 'far' ? '◀' : '', dash:z.edge === 'far' ? '' : '3 3'}, {v:z.SL, c:P.bear, lab:'SL', dash:'5 4'}, {v:z.price, c:P.acc, lab:LANG === 'en' ? 'Price' : 'Precio', dash:''}];
  const labLen = Math.max(...lines.map(l => ((l.lab ? l.lab + ' ' : '') + fx(l.v, z.dec)).length));
  const padL = 4, padR = Math.round((labLen * 0.58 + 0.9) * fs), padT = fs, padB = fs;
  const maxBars = Math.max(30, Math.floor((w - padL - padR) / (fs * 0.42)));
  const g = Math.max(1, Math.ceil(data.length / maxBars)), bars = [];
  for(let j = 0; j < data.length; j += g){ const ch = data.slice(j, j + g); bars.push({o:ch[0].o, c:ch[ch.length - 1].c, h:Math.max(...ch.map(k => k.h)), l:Math.min(...ch.map(k => k.l))}); }
  const bi = tt => idx.has(tt) ? Math.floor((idx.get(tt) - i0) / g) : bars.length - 1;
  const lv = lines.map(l => l.v);
  let lo = Math.min(...bars.map(b => b.l), ...lv), hi = Math.max(...bars.map(b => b.h), ...lv);
  const pad = (hi - lo) * 0.04 || Math.abs(hi) * 0.001 || 1; lo -= pad; hi += pad;
  const bw = (w - padL - padR) / bars.length, xr = w - padR;
  const X = b => padL + (b + 0.5) * bw, Y = v => padT + (hi - v) / (hi - lo) * (h - padT - padB);
  const o = [`<rect x="0" y="0" width="${w}" height="${h}" fill="${P.bg}"/>`];
  // zona (PRZ) desde C hasta el borde derecho
  const xC = X(bi(z.tm.C)), yA = Y(Math.max(z.near, z.far)), yB = Y(Math.min(z.near, z.far));
  o.push(`<rect x="${xC.toFixed(1)}" y="${yA.toFixed(1)}" width="${(xr - xC).toFixed(1)}" height="${Math.max(1.5, yB - yA).toFixed(1)}" fill="${P.fib}" fill-opacity=".2"/>`);
  const body = Math.max(1, bw * 0.62);
  bars.forEach((b, i) => {
    const col = b.c >= b.o ? P.bull : P.bear, x = X(i);
    o.push(`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="${col}" stroke-opacity=".55" stroke-width="${Math.max(0.8, bw * 0.12).toFixed(2)}"/>`);
    const y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
    o.push(`<rect x="${(x - body / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${body.toFixed(1)}" height="${Math.max(0.8, y2 - y1).toFixed(1)}" fill="${col}" fill-opacity=".55"/>`);
  });
  lines.forEach(l => o.push(`<line x1="${xC.toFixed(1)}" x2="${xr}" y1="${Y(l.v).toFixed(1)}" y2="${Y(l.v).toFixed(1)}" stroke="${l.c}" stroke-width="${(fs / 9).toFixed(2)}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''}/>`));
  const labs = lines.map(l => ({...l, y:Y(l.v)})).sort((a, b) => a.y - b.y), gap = fs * 1.25;
  for(let i = 1; i < labs.length; i++) if(labs[i].y - labs[i - 1].y < gap) labs[i].y = labs[i - 1].y + gap;
  const over = labs.length ? labs[labs.length - 1].y - (h - fs * 0.4) : 0;
  if(over > 0) labs.forEach(l => { l.y -= over; });
  for(let i = labs.length - 2; i >= 0; i--) if(labs[i + 1].y - labs[i].y < gap) labs[i].y = labs[i + 1].y - gap;
  labs.forEach(l => o.push(`<text x="${xr + fs * 0.4}" y="${(l.y + fs * 0.36).toFixed(1)}" font-size="${fs}" font-family="${FONT}" fill="${l.c}" font-weight="700">${l.lab ? esc(l.lab) + ' ' : ''}<tspan font-weight="400" fill="${P.muted}">${esc(fx(l.v, z.dec))}</tspan></text>`));
  // estructura X-A-B-C y el tramo CD en curso hasta el precio actual
  const pts = [['X', z.tm.X, z.coords.X], ['A', z.tm.A, z.coords.A], ['B', z.tm.B, z.coords.B], ['C', z.tm.C, z.coords.C]].map(([n, tt, v]) => ({n, x:X(bi(tt)), y:Y(v), v}));
  o.push(`<polygon points="${pts.slice(0, 3).map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" fill="${P.tri}"/>`);
  o.push(`<polyline points="${pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" fill="none" stroke="${P.acc}" stroke-width="${(fs / 6.5).toFixed(2)}" stroke-linejoin="round"/>`);
  const xP = X(bars.length - 1), yP = Y(z.price), pC = pts[3];
  o.push(`<line x1="${pC.x.toFixed(1)}" y1="${pC.y.toFixed(1)}" x2="${xP.toFixed(1)}" y2="${yP.toFixed(1)}" stroke="${P.acc}" stroke-width="${(fs / 9).toFixed(2)}" stroke-dasharray="4 3"/>`);
  pts.forEach((p, i) => {
    const top = i === 0 ? p.v > pts[1].v : p.v > pts[i - 1].v, ty = top ? p.y - fs * 0.6 : p.y + fs * 1.3;
    o.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(fs / 4).toFixed(1)}" fill="${P.acc}"/>`);
    o.push(`<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="${fs * 1.05}" font-family="${FONT}" font-weight="700" fill="${P.ink}">${p.n}</text>`);
  });
  o.push(`<circle cx="${xP.toFixed(1)}" cy="${yP.toFixed(1)}" r="${(fs / 3).toFixed(1)}" fill="${P.acc}"/>`);
  return o.join('');
}

/* ---------- vigilancia automática y avisos en la PC ---------- */
// Repite la búsqueda cada N minutos mientras la página esté abierta. Avisa (sonido, notificación del navegador y título de la pestaña)
// cuando un borde entra en la lista por primera vez. Un mismo borde no vuelve a avisar hasta que lleve 30 min fuera de la lista.
const ALERT = {seen:new Map(), log:[], timer:0, next:0, ctx:null, unread:0, baseTitle:''};
const ALERT_FORGET = 30 * 60 * 1000;
function audioInit(){ try { if(!ALERT.ctx) ALERT.ctx = new (window.AudioContext || window.webkitAudioContext)(); if(ALERT.ctx.state === 'suspended') ALERT.ctx.resume(); } catch(e){} }
function beep(){
  const c = ALERT.ctx; if(!c) return;
  try { if(c.state === 'suspended') c.resume();
    [[880, 0], [1175, 0.18], [880, 0.36]].forEach(([f, t0]) => {
      const o = c.createOscillator(), g = c.createGain(), st = c.currentTime + t0;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.25, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.16);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.18);
    });
  } catch(e){}
}
const notifOK = () => 'Notification' in window && Notification.permission === 'granted';
function notify(title, body, tag){ if(!notifOK()) return; try { const n = new Notification(title, {body, tag, renotify:true}); n.onclick = () => { window.focus(); location.hash = '#cerca'; n.close(); }; } catch(e){} }
function alertLine(z){ return `${symName(z.sym)} ${tfName(z.gran)} · #${z.code} · ${sideWord(z.dir)} · ${patName(z.k)}: ${nearBadge(z)} (${fx(z.edgeV, z.dec)})`; }
function afterScan(){
  if(S.watch){
    const now = Date.now(), items = nearItems(), fresh = [];
    items.forEach(z => { if(!ALERT.seen.has(z.key)) fresh.push(z); ALERT.seen.set(z.key, now); });
    ALERT.seen.forEach((tm, k) => { if(now - tm > ALERT_FORGET) ALERT.seen.delete(k); });
    if(fresh.length){
      fresh.forEach(z => ALERT.log.unshift({t:nowS(), txt:alertLine(z), dir:z.dir}));
      ALERT.log = ALERT.log.slice(0, 40);
      beep();
      if(fresh.length <= 3) fresh.forEach(z => notify(`HARMONIX · ${symName(z.sym)} ${tfName(z.gran)}`, `${sideWord(z.dir, true)} · ${patName(z.k)}\n${nearBadge(z)} (${fx(z.edgeV, z.dec)})`, z.key));
      else notify('HARMONIX', t('notifMany', fresh.length) + '\n' + fresh.slice(0, 4).map(alertLine).join('\n'), 'harmonix-many');
      if(document.hidden){ ALERT.unread += fresh.length; document.title = `(${ALERT.unread}) ` + ALERT.baseTitle; }
    }
    clearTimeout(ALERT.timer);
    const ms = Math.max(1, +S.watchMin || 2) * 60000; ALERT.next = Date.now() + ms;
    ALERT.timer = setTimeout(() => { if(S.watch) runScan(); }, ms);
  }
  renderWatch();
}

const csvQ = v => { const s = v == null ? '' : String(v); return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function saveSignals(){
  const picked = pickedList();

  const rows = picked.map(s => [s.id, new Date(s.t0 * 1000).toISOString(), s.t0, s.band, s.sym, symName(s.sym), tfName(s.gran), s.gran, s.dir > 0 ? 'buy' : 'sell', s.k, patName(s.k), s.scale, sigStatus(s), s.dec,

function parseCsv(text){
  const out = []; let row = [], cur = '', q = false;
  text = text.replace(/^\ufeff/, '');
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if(c === '"') q = true; else if(c === ',' || c === ';') { row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}
function readSignalFile(text){
  const rows = parseCsv(text); if(rows.length < 2) return null;
  const head = rows[0].map(h => h.trim().toLowerCase()), col = n => head.indexOf(n);
  if(['simbolo','granularidad','lado','entrada','sl','tp1','epoch'].some(n => col(n) < 0)) return null;
  const out = [];
  rows.slice(1).forEach(r => {
    const g = n => (r[col(n)] || '').trim(), nm = n => num(g(n));
    const s = {id:g('id'), t0:Math.round(nm('epoch')), band:g('grupo') === 'mkt' ? 'mkt' : 'synth', sym:g('simbolo'), gran:Math.round(nm('granularidad')), dir:g('lado') === 'sell' ? -1 : 1,
      k:SIM[g('patron')] ? g('patron') : g('patron'), kName:g('patron_nombre'), scale:g('escala'), st:g('estado'), dec:isF(nm('decimales')) ? Math.round(nm('decimales')) : 2,
      entry:nm('entrada'), SL:nm('sl'), tps:[1, 2, 3].map(i => ({n:'TP' + i, v:nm('tp' + i), k:nm('tp' + i + '_ratio'), ref:g('tramo')})), Dv:nm('d'), Dt:nm('d_epoch')};
    if(!s.sym || !isF(s.t0) || !isF(s.entry) || !isF(s.SL) || !s.tps.every(q => isF(q.v))) return;

const floatR = (s, e) => e ? s.dir * (e.last - s.entry) / Math.abs(s.entry - s.SL) : null;

  const agg = keyF => { const m = new Map(); list.forEach(x => { const k = keyF(x); if(!m.has(k)) m.set(k, {k, n:0, w:0, l:0, r:0}); const q = m.get(k); q.n++; q.w += x.o.win ? 1 : 0; q.l += x.o.loss ? 1 : 0; q.r += x.o.r; }); return [...m.values()].sort((p, q) => q.n - p.n); };

document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.pick){ const s = SCAN.items.find(q => q.id === el.dataset.pick); if(s){ s.pick = el.checked; renderSaveBar(); } return; }
  if(el.dataset.sym){ const s = el.dataset.sym; S.off = S.off.filter(x => x !== s); if(!el.checked) S.off.push(s); saveS(); renderInstSum(); return; }
  if(el.id === 'histSel'){ S.hist = +el.value; saveS(); return; }
  if(el.id === 'optAdv'){ const v = num(el.value); if(isF(v) && v > 0 && v <= 100){ S.adv = v; saveS(); SCAN.items.forEach(s => { s.pick = s.pick && sigStatus(s) !== 'adv'; }); renderCards(); } else el.value = S.adv; return; }
  if(el.id === 'optAge'){ const v = Math.round(num(el.value)); if(isF(v) && v >= 1){ S.age = Math.min(TRK_MAX_AGE, v); saveS(); el.value = S.age; } else el.value = S.age; return; }
  if(el.id === 'edgesSel'){ S.edges = el.value; saveS(); renderNear(); return; }
  if(el.id === 'mktPct'){ const v = num(el.value); if(isF(v) && v > 0 && v <= 50){ S.mktPct = v; saveS(); renderNear(); } else el.value = S.mktPct; return; }

  if(el.id === 'optWatch'){ setWatch(el.checked); return; }
  if(el.id === 'watchMin'){ S.watchMin = +el.value || 2; saveS(); if(S.watch && !SCAN.running){ clearTimeout(ALERT.timer); const ms = S.watchMin * 60000; ALERT.next = Date.now() + ms; ALERT.timer = setTimeout(() => { if(S.watch) runScan(); }, ms); } renderWatch(); return; }
  if(el.id === 'optReact'){ const v = num(el.value); if(isF(v) && v > 0 && v <= 100){ S.nearReact = v; saveS(); renderNear(); } else el.value = S.nearReact; return; }
  if(el.id === 'optWait'){ S.wait = el.checked; saveS(); renderCards(); return; }

  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === th)));
  try { localStorage.setItem('grafico-armonico:tema', th); } catch(e) {}
}
